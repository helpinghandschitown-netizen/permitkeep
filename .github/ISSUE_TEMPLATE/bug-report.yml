name: Privacy-safe bug report
description: Report a reproducible PermitKeep problem using invented examples only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This is a PUBLIC issue, not a private support channel. Do not include backups, real permit records, names, locations, license codes, payment-return URLs, payment details, credentials, console dumps, or network recordings. Review attachments before submitting; prefer text with invented examples.

        Protect your working profile and unsaved drafts first. Do not reset storage, repeat a destructive restore, or import real data into a demonstration profile to reproduce a problem. PermitKeep has no hosted ledger to recover. This form does not offer emergency renewal help or a response-time guarantee.

        Read the [backup and safe-support guide](https://helpinghandschitown-netizen.github.io/permitkeep/permitkeep-backup-and-handoff.html#safe-support). Continue urgent renewal work with the responsible operator and issuing agency. Do not report private security details here; this public form is not a confidential disclosure channel.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report privacy check
      options:
        - label: I reviewed the report and attachments and removed real business records, secrets, license codes, payment details, and payment-return URLs.
          required: true
        - label: I understand this report is public and is not a backup or emergency renewal service.
          required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: Browser name/version and operating system only. Do not include account or device identifiers.
      placeholder: "Example: Firefox, Windows 11; version unknown"
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: How was the app opened?
      options:
        - Browser tab
        - Installed app
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Network state when the problem occurred
      options:
        - Online
        - Offline
        - Connection changed during the action
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
      description: Use invented examples only. Say if a clean-profile check was not attempted; do not risk your working records to satisfy this form.
      placeholder: "1. Open the app\n2. Use an invented example\n3. Describe the action"
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual results
      description: Include redacted error wording and whether this happens every time. Mark unknown facts as unknown. Do not paste console dumps or payment URLs.
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Recent changes, if known
      description: Say whether the browser profile, device, app address, or connectivity changed. Do not include identifiers or full URLs with query parameters or fragments.
